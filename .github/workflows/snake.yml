name: Generate Snake Animation

on:
  schedule:
    - cron: "0 0 * * *"   # runs once a day
  workflow_dispatch:        # allows manual trigger from the Actions tab
  push:
    branches:
      - main

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Generate snake SVGs
        uses: Platane/snk@v3
        with:
          github_user_name: athiops
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=%23ff0000&color_dots=%23330000,%23660000,%23990000,%23cc0000,%23ff0000
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=%23ff0000

      - name: Push generated files to the "output" branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
